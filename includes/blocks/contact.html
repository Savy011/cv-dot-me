<section
  class="contact"
  aria-labelledby="contact-details"
>
  <h3
    class="section__heading"
    id="contact-details"
  >
    Contact
  </h3>

  <dl class="contact__list">
    {% for item in contact %}
      <div class="contact__item">
        <dt class="contact__platform">{{ item.platform }}</dt>
        <dd class="contact__label"><a href="{{ item.url }}">{{ item.label }}</a></dd>
      </div>
    {% endfor %}
  </dl>
</section>
