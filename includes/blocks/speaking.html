{% from "macros.html" import entry %}

<section
  class="section"
  aria-labelledby="speaking-details"
>
  <h3
    class="section__heading"
    id="speaking-details"
  >
    Speaking
  </h3>

  <ol
    class="section__list"
    reversed
  >
    {% for i in speaking | reverse %}
      {{ entry(i.date, i.title, null, i.location) }}
    {% endfor %}
  </ol>
</section>
