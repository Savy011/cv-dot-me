<header class="header">
  <div class="header__profile">
    <img src="/_assets/{{ config.profile_img }}" />
  </div>
  <div class="header__details">
    <h1 class="header__title">{{ config.name }}</h1>
    <p class="header__subtitle">@ {{ config.location }} ({{ config.pronouns }})</p>
    <p class="header__link"><a href="{{ config.website }}">{{ config.website }}</a></p>
  </div>
</header>
