{% set assetHash = global.random() %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>{{ config.name }}</title>

    <!-- prettier-ignore-start -->
    <style>
      {% renderFile "./styles/critical.scss" %}
    </style>
    <!-- prettier-ignore-end -->

    <link
      rel="stylesheet"
      media="print"
      href="/fonts.css?{{ assetHash }}"
      onload="this.media='all'"
    />
  </head>

  <body>
    <div class="wrapper">{{ content | safe }}</div>
  </body>
</html>
